<style>
/* Layout : outil de saisie en onglets, rapport administratif en aperçu papier */
:root{--bg:#f3f5f3;--panel:#fff;--ink:#1c2321;--muted:#5a6560;--line:#d4dad6;--accent:#163f6b;--accent-ink:#fff;--warn:#8a5300;--warn-bg:#fff3dc;--bad:#a12c22;--bad-bg:#fce8e5;--ok:#1d6b3a;--ok-bg:#e4f3e9;--field:#fbfcfb;--shade:rgba(10,20,30,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111618;--panel:#1a2023;--ink:#e5eaec;--muted:#98a4a9;--line:#30393d;--accent:#7fb0e6;--accent-ink:#0b1520;--warn:#f0b35a;--warn-bg:#2e2412;--bad:#f08378;--bad-bg:#331b18;--ok:#7ed39c;--ok-bg:#16291d;--field:#151a1d;--shade:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111618;--panel:#1a2023;--ink:#e5eaec;--muted:#98a4a9;--line:#30393d;--accent:#7fb0e6;--accent-ink:#0b1520;--warn:#f0b35a;--warn-bg:#2e2412;--bad:#f08378;--bad-bg:#331b18;--ok:#7ed39c;--ok-bg:#16291d;--field:#151a1d;--shade:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (max-width:760px),(pointer:coarse){body input,body select,body textarea{font-size:16px}}
@media (pointer:coarse){.btn{min-height:44px;padding-block:9px}.btn.sm{min-height:38px}nav button{min-height:46px}.chk label{min-height:40px}input[type=checkbox]{width:22px!important;height:22px}}
.bkp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--accent);color:var(--accent-ink);padding-block:12px}
header h1{margin:0;font-size:17px;text-wrap:balance}
header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar select{flex:1 1 220px;min-width:0}
nav{display:flex;gap:2px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
nav button{border:0;background:none;color:var(--muted);padding:11px 10px;font:inherit;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent)}
nav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--line);font-size:11.5px;text-align:center;font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding-block:16px}
section{display:none}section.on{display:block}
h2{font-size:16px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 12px}
.wide{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:700;font-size:13.5px;flex-wrap:wrap}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 14px}
.chk label{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14px}
.chk input{width:auto}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:9px}
.tag.auto{background:var(--ok-bg);color:var(--ok)}.tag.man{background:var(--warn-bg);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}
.alert{border-radius:6px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.alert.w{background:var(--warn-bg);color:var(--warn)}.alert.b{background:var(--bad-bg);color:var(--bad)}.alert.o{background:var(--ok-bg);color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:28px;overflow-x:auto}
.ovl{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.ovl .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.ovl .box h2{margin-top:0}
#lock{background:var(--bg);z-index:50}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:14px;z-index:60;max-width:90vw}
.rp{font:12.5px/1.45 "Times New Roman",Georgia,serif;color:#111;min-width:0}
.rp table{border-collapse:collapse;width:100%;margin:6px 0 12px}
.rp th,.rp td{border:1px solid #555;padding:4px 6px;text-align:left;vertical-align:top}
.rp th{background:#e8ece9}
.rp table.kv td{border:0;padding:1px 6px 1px 0}
.rp h3{font-size:13.5px;margin:16px 0 6px;text-transform:uppercase}
.rp .ent{display:flex;justify-content:space-between;gap:20px;font-size:11.5px;text-align:center}
.rp .ent div{flex:0 1 48%}
.rp .ttl{text-align:center;margin:18px 0 4px;font-size:15px;font-weight:700;text-decoration:underline}
.rp .sg{display:flex;justify-content:space-between;gap:20px;margin-top:26px}
.rp .sg div{flex:0 1 45%;text-align:center}
@media print{
 body{background:#fff}body::before{display:none}
 header,.bar,nav,.noprint,#toast,.ovl{display:none!important}
 main{padding:0;max-width:none}
 section{display:none!important}section#s-rapport{display:block!important}
 .paper{border:0;padding:0}
 .rp tr{page-break-inside:avoid}
 @page{size:A4;margin:16mm 14mm}
}
@media (max-width:560px){.paper{padding:14px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

 <div class="box">

  <label for="pin">Code d'accès <input type="password" id="pin" autocomplete="current-password"></label>

  <div class="row" style="margin:14px 0 0"><button class="btn p" id="unlock">Ouvrir</button><button class="btn d sm" id="reset" style="margin-left:auto">Effacer toutes les données</button></div>
  <p class="alert b" id="lock-e" hidden></p>
 </div>
</div>

<header class="gut">
 <h1>Fiche technique de patrouille — Brigades sectorielles</h1>

 <button class="btn" id="b-imp">Importer</button>

<script>
"use strict";
/* ================= Référentiels ================= */
const REF_ARRETE="Arrêté n°000513/PE/CL/SG/DGE/DPHP du 30 septembre 2026 portant création des Brigades sectorielles pour la lutte contre l'insalubrité et l'incivisme dans la Commune de Libreville";
const ENTETE_DEF="COMMANDEMENT EN CHEF DES FORCES\nDE POLICE NATIONALE\n--------\nPRÉFECTURE DE POLICE DE LIBREVILLE\n--------\nCOMMISSARIAT DE POLICE\nDU 3ème ARRONDISSEMENT\n--------\nCABINET";
const NUMREF_DEF="N° ________/PPL/CPL3ème Arr/CAB";
const ARR=["Hôtel de ville","1er arrondissement","2e arrondissement","3e arrondissement","4e arrondissement","5e arrondissement","6e arrondissement"];
const MISSIONS=["Constater et centraliser les infractions","Constater la sortie des ordures ménagères après les heures indiquées","Effectuer les verbalisations","Élaborer des mises en demeure","Rédiger des convocations et établir des procès-verbaux de constat","Procéder aux déguerpissements et aux saisies","Procéder, le cas échéant, aux fermetures d'activités commerciales"];
const SERVICES=["Inspection Générale Municipale (IGM)","Direction Générale de l'Environnement (DGE)","DGCHAUTIU","Direction Générale des Finances (DGF)","Mairie du 1er arrondissement","Mairie du 2e arrondissement","Mairie du 3e arrondissement","Mairie du 4e arrondissement","Mairie du 5e arrondissement","Mairie du 6e arrondissement","Unités de Police de l'Hôtel de ville","Brigade spéciale de Gendarmerie de l'Hôtel de ville","Commissariat de police du 3ème arrondissement","Autre"];
const QUALITES=["OPJ","APJ","Agent municipal assermenté","Agent municipal","Chauffeur","Autre"];
const ROLES=["Chef de patrouille","Adjoint","Agent verbalisateur","Rédacteur PV","Sécurisation","Chauffeur","Agent"];
const NATURES=["Dépôt sauvage d'ordures","Sortie des ordures hors horaires","Occupation illicite du domaine public","Commerce / étal insalubre","Déversement d'eaux usées","Absence de bac à ordures","Installation / construction illicite","Épave ou véhicule abandonné","Déchets commerciaux ou industriels","Autre"];
const MESURES=["Sensibilisation / avertissement","Mise en demeure","Convocation","PV de constat","Verbalisation","Saisie","Fermeture","Déguerpissement","Mise en fourrière"];
const COERCITIVES=["PV de constat","Verbalisation","Saisie","Fermeture","Déguerpissement","Mise en fourrière"];
const VISAS=["Chef de patrouille","Cachet autorité locale (chef de quartier)","Cachet mairie d'arrondissement","Cachet commissariat / brigade","Sans visa"];
const VEHIC=["Véhicule léger","Pick-up","Camion benne","Dépanneuse / fourrière","Moto","Patrouille pédestre","Autre"];
const CROLES=["Responsable du dispositif","Superviseur","Permanence / PC","Appui police","Appui gendarmerie","Parquet","Mairie d'arrondissement","Autre"];
const SCHEMAS={
 equipe:{t:"Agent",cols:[["nom","Nom et prénoms"],["grade","Grade / fonction"],["matricule","Matricule"],["service","Service d'origine","sel",SERVICES],["qualite","Qualité juridique","sel",QUALITES],["role","Rôle dans la patrouille","sel",ROLES],["tel","Téléphone","tel"]]},
 itineraire:{t:"Point",cols:[["point","Point de passage / lieu"],["quartier","Quartier"],["heure","Heure prévue","time"],["objectif","Objectif / vérification"],["repere","Repère"]]},
 constats:{t:"Constat",cols:[["heure","Heure","time"],["lieu","Lieu précis"],["nature","Nature de l'infraction","sel",NATURES],["contrevenant","Contrevenant (nom / enseigne)"],["contact","Contact contrevenant","tel"],["mesure","Mesure prise","sel",MESURES],["refpv","Réf. PV / mise en demeure"],["agent","Agent constatateur"],["obs","Observations","area"]]},
 moyens:{t:"Moyen",cols:[["type","Type","sel",VEHIC],["immat","Immatriculation"],["service","Service affectataire","sel",SERVICES],["chauffeur","Chauffeur"],["kmd","Km départ","num"],["kmr","Km retour","num"],["obs","État / observations"]]},
 contacts:{t:"Contact",cols:[["role","Rôle","sel",CROLES],["nom","Nom"],["fonction","Fonction"],["structure","Structure"],["tel","Téléphone","tel"]]}
};
const TABS=[["fiche","Fiche"],["equipe","Équipe"],["itineraire","Itinéraire"],["pointages","Pointages"],["constats","Constats"],["moyens","Moyens"],["contacts","Contacts"],["rapport","Rapport"]];

/* ================= Environnement ================= */
const HOSTED=!!(window.claude&&typeof window.claude.use==="function");
let DL=null;
if(HOSTED){window.claude.use("downloads").then(d=>{DL=d}).catch(()=>{})}

/* ================= Utilitaires ================= */
let DB={fiches:[],entete:ENTETE_DEF,numref:NUMREF_DEF}, KEY=null, SALT=null, cur=null, tab="fiche", saveT=null, idleT=null;
const STORE="fpatrouille.v1", IDLE_MIN=10;
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const fmtDT=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("fr-FR")+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
const fmtD=s=>s?new Date(s+"T12:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"}):"";
const hm=iso=>iso?new Date(iso).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"";
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,3000)}
function modal(html){$("#modal-box").innerHTML=html;$("#modal").hidden=false;return $("#modal-box")}
function closeModal(){$("#modal").hidden=true;$("#modal-box").innerHTML=""}
function ask(msg,ok="Confirmer"){return new Promise(res=>{const b=modal(`<h2>Confirmation</h2><p>${esc(msg)}</p><div class="row" style="margin:0"><button class="btn d" id="m-ok">${esc(ok)}</button><button class="btn" id="m-no">Annuler</button></div>`);
 b.querySelector("#m-ok").onclick=()=>{closeModal();res(true)};b.querySelector("#m-no").onclick=()=>{closeModal();res(false)}})}

/* ================= Chiffrement ================= */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{const a=new Uint8Array(u);let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pin,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(obj,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj)));
 return {v:1,app:"fiche-patrouille",salt:b64(salt),iv:b64(iv),ct:b64(ct)}}
async function unseal(blob,pin){const salt=ub64(blob.salt);const key=await derive(pin,salt);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(blob.iv)},key,ub64(blob.ct));return {obj:JSON.parse(dec.decode(pt)),key,salt}}
function readStore(){try{const s=localStorage.getItem(STORE);return s?JSON.parse(s):null}catch(e){return undefined}}
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{if(!KEY)return;
 try{const blob=await seal(DB,KEY,SALT);localStorage.setItem(STORE,JSON.stringify(blob))}catch(e){toast("Enregistrement local impossible : exportez une sauvegarde chiffrée.")}},400)}

/* ================= Verrouillage ================= */
let firstRun=false;
function showLock(){const st=readStore();firstRun=!st;
 $("#lock").hidden=false;$("#pin").value="";$("#pin2").value="";$("#lock-e").hidden=true;
 if(firstRun){$("#lock-t").textContent="Première utilisation";$("#lock-m").textContent="Définissez un code d'accès (6 caractères minimum). Il chiffre les données sur cet appareil : sans lui, elles sont irrécupérables.";$("#pin2-l").hidden=false;$("#unlock").textContent="Créer le code"}
 else{$("#lock-t").textContent="Accès protégé";$("#lock-m").textContent="Saisissez le code d'accès. Les données sont chiffrées sur cet appareil (AES-256).";$("#pin2-l").hidden=true;$("#unlock").textContent="Ouvrir"}
 if(st===undefined)$("#lock-m").textContent+=" Attention : le stockage local est bloqué dans ce navigateur, les fiches ne seront pas conservées après fermeture.";
 setTimeout(()=>$("#pin").focus(),50)}
function lockErr(m){const e=$("#lock-e");e.textContent=m;e.hidden=false}
async function unlock(){if(!window.crypto||!crypto.subtle)return lockErr("Chiffrement indisponible dans ce navigateur. Utilisez Chrome, Edge, Firefox ou Safari récents.");
 const pin=$("#pin").value;$("#unlock").disabled=true;
 try{
  if(firstRun){if(pin.length<6)return lockErr("Code trop court : 6 caractères minimum.");if(pin!==$("#pin2").value)return lockErr("Les deux codes ne correspondent pas.");
   SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(pin,SALT);DB={fiches:[],entete:ENTETE_DEF,numref:NUMREF_DEF};newFiche();save()}
  else{try{const r=await unseal(readStore(),pin);DB=r.obj;KEY=r.key;SALT=r.salt}catch(e){return lockErr("Code incorrect.")}
   if(DB.entete==null)DB.entete=ENTETE_DEF;if(DB.numref==null)DB.numref=NUMREF_DEF;if(!DB.fiches.length)newFiche()}
  $("#lock").hidden=true;if(!cur||!DB.fiches.find(f=>f.id===cur))cur=DB.fiches[0].id;renderAll();bumpIdle()
 }finally{$("#unlock").disabled=false}}
function doLock(){KEY=null;DB={fiches:[]};$("#main").innerHTML="";closeModal();showLock()}
function bumpIdle(){clearTimeout(idleT);if(KEY)idleT=setTimeout(()=>{save();setTimeout(doLock,600)},IDLE_MIN*60000)}
["click","keydown","touchstart"].forEach(e=>document.addEventListener(e,bumpIdle,{passive:true}));
$("#unlock").onclick=unlock;$("#pin").onkeydown=$("#pin2").onkeydown=e=>{if(e.key==="Enter")unlock()};
$("#reset").onclick=async()=>{$("#lock").hidden=true;const ok=await ask("Effacer définitivement toutes les fiches enregistrées sur cet appareil ?","Tout effacer");if(ok){try{localStorage.removeItem(STORE)}catch(e){}}showLock()};
$("#b-lock").onclick=()=>{save();setTimeout(doLock,500)};

/* ================= Fiches ================= */
function blank(){return{id:uid(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),numero:"",date:today(),arrondissement:"3e arrondissement",brigade:"",secteur:"",debut:"",fin:"",chef:"",chefTel:"",ordonnateur:"",refArrete:REF_ARRETE,refDesignation:"",missions:[],consignes:"",incidents:"",observations:"",equipe:[],itineraire:[],pointages:[],constats:[],moyens:[],contacts:[]}}
function newFiche(){const f=blank();const n=DB.fiches.filter(x=>x.date===f.date).length+1;f.numero=`FP-${f.date.replace(/-/g,"")}-${String(n).padStart(2,"0")}`;DB.fiches.unshift(f);cur=f.id;return f}
const F=()=>DB.fiches.find(f=>f.id===cur);
function touch(){const f=F();if(f)f.updatedAt=new Date().toISOString();save()}
function renderSel(){$("#sel").innerHTML=DB.fiches.map(f=>`<option value="${f.id}" ${f.id===cur?"selected":""}>${esc(f.numero||"Sans numéro")} — ${esc(fmtD(f.date))} — ${esc(f.arrondissement)}${f.brigade?" / brig. "+esc(f.brigade):""}</option>`).join("")}
$("#sel").onchange=e=>{cur=e.target.value;renderAll()};
$("#b-new").onclick=()=>{newFiche();save();tab="fiche";renderAll();toast("Nouvelle fiche créée")};
$("#b-dup").onclick=()=>{const s=F(),f=JSON.parse(JSON.stringify(s));Object.assign(f,{id:uid(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),date:today(),pointages:[],constats:[],incidents:"",observations:"",supprimes:0});
 f.moyens.forEach(m=>{m.kmd="";m.kmr=""});f.numero=s.numero+"-bis";DB.fiches.unshift(f);cur=f.id;save();renderAll();toast("Fiche dupliquée : équipe, itinéraire, moyens et contacts repris")};

/* ================= Analyse ================= */
function analyse(f){const A=[];const eq=f.equipe;
 const opj=eq.filter(a=>["OPJ","APJ"].includes(a.qualite));
 const coerc=f.constats.filter(c=>COERCITIVES.includes(c.mesure));
 if(!eq.length)A.push(["b","Aucun agent inscrit dans l'équipe."]);
 if(coerc.length&&!opj.length)A.push(["b",`${coerc.length} mesure(s) coercitive(s) (PV, verbalisation, saisie, fermeture, déguerpissement, fourrière) sans OPJ ni APJ dans l'équipe : risque de nullité des actes. Base légale à vérifier.`]);
 if(eq.length&&!eq.some(a=>a.role==="Chef de patrouille")&&!f.chef)A.push(["w","Chef de patrouille non désigné."]);
 eq.filter(a=>/^Mairie du (\d)/.test(a.service||"")).forEach(a=>{const n=a.service.match(/(\d)/)[1];if(!(f.arrondissement||"").startsWith(n))A.push(["w",`${a.nom||"Agent"} (${a.service}) intervient hors de son arrondissement : contraire à l'art. 6 de l'arrêté.`])});
 if(!f.refDesignation)A.push(["w","Arrêté de désignation des agents (art. 5) non renseigné."]);
 const done=new Set(f.pointages.map(p=>p.point));const miss=f.itineraire.filter(p=>p.point&&!done.has(p.point));
 if(f.itineraire.length&&miss.length)A.push(["w",`${miss.length} point(s) d'itinéraire non pointé(s) : ${miss.map(p=>p.point).join(", ")}.`]);
 f.itineraire.forEach(p=>{if(!p.heure)return;const pt=f.pointages.find(x=>x.point===p.point);if(!pt)return;const d=(new Date(pt.heure)-new Date(`${f.date}T${p.heure}`))/60000;if(Math.abs(d)>30)A.push(["w",`Écart de ${Math.round(d)} min au point « ${p.point} » (prévu ${p.heure}, pointé ${hm(pt.heure)}).`])});
 const man=f.pointages.filter(p=>p.mode==="manuel").length;if(man)A.push(["w",`${man} pointage(s) saisi(s) manuellement.`]);
 if(f.supprimes)A.push(["w",`${f.supprimes} pointage(s) supprimé(s) après enregistrement.`]);
 f.moyens.forEach(m=>{if(m.type!=="Patrouille pédestre"&&m.kmd&&!m.kmr)A.push(["w",`Kilométrage retour manquant : ${m.immat||m.type}.`]);if(m.kmd&&m.kmr&&+m.kmr<+m.kmd)A.push(["b",`Kilométrage incohérent : ${m.immat||m.type}.`])});
 if(f.refArrete===REF_ARRETE&&f.date>"2026-12-30")A.push(["b","Date postérieure à la durée de 3 mois prévue à l'art. 7 : vérifier l'existence d'un acte de prorogation."]);
 if(!A.length)A.push(["o","Aucune anomalie détectée."]);return A}
function stats(f){const cnt=(arr,k)=>arr.reduce((o,x)=>{const v=x[k]||"Non précisé";o[v]=(o[v]||0)+1;return o},{});
 const km=f.moyens.reduce((s,m)=>s+((m.kmd&&m.kmr&&+m.kmr>=+m.kmd)?(+m.kmr-+m.kmd):0),0);
 const done=new Set(f.pointages.map(p=>p.point));const prevus=f.itineraire.filter(p=>p.point).length;const faits=f.itineraire.filter(p=>p.point&&done.has(p.point)).length;
 let duree="";if(f.debut&&f.fin){let m=(+f.fin.slice(0,2)*60+ +f.fin.slice(3))-(+f.debut.slice(0,2)*60+ +f.debut.slice(3));if(m<0)m+=1440;duree=`${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`}
 return{nat:cnt(f.constats,"nature"),mes:cnt(f.constats,"mesure"),svc:cnt(f.equipe,"service"),km,prevus,faits,duree,veh:f.moyens.filter(m=>m.type&&m.type!=="Patrouille pédestre").length}}

/* ================= Rapport : modèle unique ================= */
function blocks(f){const S=stats(f),A=analyse(f),B=[];const ecart=p=>{const pt=f.pointages.find(x=>x.point===p.point);if(!pt||!p.heure)return"";const e=Math.round((new Date(pt.heure)-new Date(`${f.date}T${p.heure}`))/60000);return(e>0?"+":"")+e+" min"};

 B.push({t:"sub",text:`du ${fmtD(f.date)}${f.debut?`, de ${f.debut} à ${f.fin||"…"}`:""} — ${f.arrondissement}${f.brigade?", brigade n°"+f.brigade:""}`});
 B.push({t:"kv",items:[["Référence",f.refArrete],...(f.refDesignation?[["Désignation des agents",f.refDesignation]]:[]),...(f.ordonnateur?[["Autorité ordonnatrice",f.ordonnateur]]:[])]});
 B.push({t:"h",text:"1. Synthèse"});
 B.push({t:"table",head:["Indicateur","Valeur"],rows:[["Secteur / zone",`${f.arrondissement}${f.secteur?" — "+f.secteur:""}`],["Durée",S.duree||"—"],["Effectif engagé",String(f.equipe.length)],["Véhicules engagés",String(S.veh)],["Distance parcourue",S.km?S.km+" km":"—"],["Points pointés / prévus",S.prevus?`${S.faits} / ${S.prevus} (${Math.round(S.faits*100/S.prevus)} %)`:String(f.pointages.length)],["Constats relevés",String(f.constats.length)]]});
 B.push({t:"h",text:"2. Missions assignées"});
 f.missions.length?B.push({t:"list",items:f.missions}):B.push({t:"p",text:"Non renseignées."});

 B.push({t:"table",head:["N°","Nom et prénoms","Grade / fonction","Matricule","Service","Qualité","Rôle","Téléphone"],rows:f.equipe.map((a,i)=>[i+1,a.nom,a.grade,a.matricule,a.service,a.qualite,a.role,a.tel])});
 B.push({t:"h",text:"4. Moyens roulants"});
 B.push({t:"table",head:["Type","Immatriculation","Service","Chauffeur","Km départ","Km retour","Distance","Observations"],rows:f.moyens.map(m=>[m.type,m.immat,m.service,m.chauffeur,m.kmd,m.kmr,(m.kmd&&m.kmr)?(+m.kmr-+m.kmd)+" km":"",m.obs])});
 B.push({t:"h",text:"5. Itinéraire et pointages"});
 B.push({t:"table",head:["Ordre","Point","Quartier","Heure prévue","Heure pointée","Écart","Objectif"],rows:f.itineraire.map((p,i)=>{const pt=f.pointages.find(x=>x.point===p.point);return[i+1,p.point,p.quartier,p.heure,pt?hm(pt.heure):"NON POINTÉ",ecart(p),p.objectif]})});
 B.push({t:"p",text:"Détail des pointages :",b:true});
 B.push({t:"table",head:["Heure","Point","Mode","Visa / cachet","Autorité","Position GPS","Observation"],rows:f.pointages.map(p=>[hm(p.heure),p.point+(p.horsItin?" (hors itinéraire)":""),p.mode,p.visa,p.autorite,p.lat?`${p.lat}, ${p.lng} (±${p.prec} m)`:"—",p.obs])});
 B.push({t:"h",text:"6. Constats et mesures"});
 B.push({t:"table",head:["Heure","Lieu","Nature","Contrevenant","Mesure","Réf. acte","Agent","Observations"],rows:f.constats.map(c=>[c.heure,c.lieu,c.nature,c.contrevenant,c.mesure,c.refpv,c.agent,c.obs])});
 if(f.constats.length){B.push({t:"table",head:["Par nature d'infraction","Nombre"],rows:Object.entries(S.nat)});B.push({t:"table",head:["Par mesure prise","Nombre"],rows:Object.entries(S.mes)})}
 B.push({t:"h",text:"7. Incidents et observations"});
 B.push({t:"kv",items:[["Incidents",f.incidents||"Néant."],["Observations",f.observations||"Néant."]]});
 B.push({t:"h",text:"8. Points d'attention"});
 B.push({t:"list",items:A.map(([s,m])=>(s==="o"?"":s==="b"?"[Critique] ":"[Attention] ")+m)});
 B.push({t:"h",text:"9. Contacts des responsables des dispositifs"});
 B.push({t:"table",head:["Rôle","Nom","Fonction","Structure","Téléphone"],rows:f.contacts.map(c=>[c.role,c.nom,c.fonction,c.structure,c.tel])});
 B.push({t:"sign",place:`Fait à Libreville, le ${fmtD(f.date)}`,left:["VU ET TRANSMIS","Le Commissaire de police","","",""],right:["Le Chef de patrouille","","","",f.chef||""]});
 B.push({t:"small",text:`Rapport généré le ${fmtDT(new Date().toISOString())} à partir de la fiche ${f.numero}. Les heures des pointages automatiques proviennent de l'horloge de l'appareil.`});
 return B}

 case"entete":return`<div class="ent"><div>${b.left.map(l=>esc(l)||"&nbsp;").join("<br>")}</div><div>${b.right.map((l,i)=>i===1?`<i>${esc(l)}</i>`:esc(l)).join("<br>")}</div></div>`;

 case"h":return`<h3>${esc(b.text)}</h3>`;

 case"table":return b.rows.length?`<table><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(cellTxt(c))}</td>`).join("")}</tr>`).join("")}</table>`:`<p><i>Néant.</i></p>`;
 case"sign":return`<p style="text-align:right;margin-top:22px">${esc(b.place)}</p><div class="sg"><div>${b.left.map((l,i)=>i<2?`<b>${esc(l)}</b>`:esc(l)||"&nbsp;").join("<br>")}</div><div>${b.right.map((l,i)=>i<1?`<b>${esc(l)}</b>`:esc(l)||"&nbsp;").join("<br>")}</div></div>`;
 case"small":return`<p style="font-size:10.5px;color:#555;margin-top:20px">${esc(b.text)}</p>`}}).join("")+`</div>`}

/* --- ZIP (stocké, sans compression) --- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){const parts=[],cd=[];let off=0;
 const w=(arr,n,b)=>{for(let i=0;i<b;i++)arr.push((n>>>(8*i))&255)};

function toPdf(B){const {jsPDF}=window.jspdf;const d=new jsPDF({unit:"mm",format:"a4"});const M=14,PW=210,CW=PW-2*M,PH=297;let y=16;
 const need=h=>{if(y+h>PH-16){d.addPage();y=16}};

  lines.forEach(l=>{const x=o.al==="center"?(o.x??PW/2):o.al==="right"?PW-M:(o.x??M);d.text(l,x,y,{align:o.al||"left"});if(o.u){const tw=d.getTextWidth(l);const x0=o.al==="center"?x-tw/2:x;d.setLineWidth(.3);d.line(x0,y+.8,x0+tw,y+.8)}y+=lh});return lines.length};
 const auto=(head,body,o={})=>{d.autoTable({head:head?[head]:undefined,body,startY:y,margin:{left:M,right:M},theme:o.plain?"plain":"grid",styles:{font:"times",fontSize:o.fs||8.5,cellPadding:o.plain?.6:1.2,textColor:20,lineColor:[85,85,85],lineWidth:o.plain?0:.15,valign:"top",overflow:"linebreak"},headStyles:{fillColor:[232,236,233],textColor:20,fontStyle:"bold"},columnStyles:o.cs||{},didDrawPage:()=>{}});y=d.lastAutoTable.finalY+3};
 B.forEach(b=>{switch(b.t){
  case"entete":{d.setFontSize(8.5);const y0=y;let yl=y0;b.left.forEach(l=>{d.setFont("times",l&&!l.startsWith("N°")&&!l.startsWith("-")?"bold":"normal");d.text(l||"",M+45,yl,{align:"center"});yl+=3.7});
   let yr=y0;b.right.forEach((l,i)=>{d.setFont("times",i===0?"bold":i===1?"italic":"normal");d.text(l,PW-M-40,yr,{align:"center"});yr+=3.7});y=Math.max(yl,yr)+4;break}
  case"title":y+=3;txt(b.text,{b:true,u:true,sz:13.5,al:"center"});y+=1;break;
  case"sub":txt(b.text,{al:"center"});y+=3;break;
  case"kv":auto(null,b.items.map(([k,v])=>[k+" :",v]),{plain:true,fs:10,cs:{0:{fontStyle:"bold",cellWidth:42}}});break;
  case"h":y+=3;need(12);txt(b.text.toUpperCase(),{b:true,sz:10.5});y+=1;break;
  case"p":txt(b.text,{b:b.b});y+=1;break;
  case"list":b.items.forEach(i=>{d.setFont("times","normal");d.setFontSize(10);const ls=d.splitTextToSize(i,CW-6);need(ls.length*4.2);d.text("–",M+1,y);ls.forEach(l=>{d.text(l,M+6,y);y+=4.2})});y+=1;break;
  case"table":if(!b.rows.length){txt("Néant.",{i:true});y+=1}else auto(b.head,b.rows.map(r=>r.map(cellTxt)),{cs:b.head.length===2?{1:{cellWidth:28,halign:"center"}}:{}});break;
  case"sign":{need(40);y+=6;txt(b.place,{al:"right"});y+=4;const y0=y;const col=(lines,x,nb)=>{let yy=y0;lines.forEach((l,i)=>{d.setFont("times",i<nb?"bold":"normal");d.setFontSize(10.5);d.text(l||"",x,yy,{align:"center"});yy+=4.6});return yy};
   y=Math.max(col(b.left,M+CW*.25,2),col(b.right,M+CW*.75,1))+2;break}

function waText(f){const S=stats(f),A=analyse(f).filter(a=>a[0]!=="o");const L=[];
 const ent=String(DB.entete||"").split("\n").filter(l=>l&&!/^-+$/.test(l));
 L.push(`_${ent.slice(-2).join(" ")}_`,`*RAPPORT DE PATROUILLE N° ${f.numero}*`,`Brigades sectorielles — ${f.arrondissement}${f.brigade?" — Brig. "+f.brigade:""}`,`📅 ${fmtD(f.date)}${f.debut?` | ${f.debut}–${f.fin||"…"}`:""}`,`Réf. : ${f.refArrete}`,"");
 L.push(`*Chef de patrouille :* ${f.chef||"—"}${f.chefTel?" ("+f.chefTel+")":""}`,`*Effectif :* ${f.equipe.length} agent(s)`);
 Object.entries(S.svc).forEach(([k,v])=>L.push(`  • ${k} : ${v}`));
 L.push(`*Véhicules :* ${f.moyens.map(m=>`${m.type||""} ${m.immat||""}`.trim()).join(", ")||"—"}${S.km?` | ${S.km} km`:""}`,"");
 L.push(`*Itinéraire :* ${S.faits}/${S.prevus} points pointés`);
 f.itineraire.forEach((p,i)=>{const pt=f.pointages.find(x=>x.point===p.point);L.push(`  ${i+1}. ${p.point||"?"}${p.heure?" (prévu "+p.heure+")":""} → ${pt?"✅ "+hm(pt.heure):"❌ non pointé"}`)});
 L.push("",`*Constats :* ${f.constats.length}`);Object.entries(S.nat).forEach(([k,v])=>L.push(`  • ${k} : ${v}`));
 if(f.constats.length){L.push("*Mesures :*");Object.entries(S.mes).forEach(([k,v])=>L.push(`  • ${k} : ${v}`))}
 L.push("",`*Incidents :* ${f.incidents||"Néant"}`);if(f.observations)L.push(`*Observations :* ${f.observations}`);
 if(A.length){L.push("","*Points d'attention :*");A.forEach(a=>L.push("⚠️ "+a[1]))}
 const resp=f.contacts.filter(c=>c.tel);if(resp.length){L.push("","*Contacts :*");resp.forEach(c=>L.push(`  • ${c.role||""} : ${c.nom||""} — ${c.tel}`))}
 return L.join("\n")}

/* ================= Enregistrement des fichiers ================= */
async function saveFile(name,blob){
 if(HOSTED){if(!DL){try{DL=await window.claude.use("downloads")}catch(e){}}
  if(!DL)return toast("Téléchargement indisponible dans cette vue.");
  try{await DL.save({filename:name,data:blob});toast("Fichier enregistré : "+name);return true}catch(e){toast(e&&e.code==="declined"?"Enregistrement annulé.":"Enregistrement impossible ("+(e&&e.code||"erreur")+").");return false}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Fichier généré : "+name);return true}

$("#f-imp").onchange=async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;let blob;
 try{blob=JSON.parse(await file.text());if(!blob.ct)throw 0}catch(err){return toast("Fichier non reconnu : choisissez une sauvegarde chiffrée de l'application.")}
 const b=modal(`<h2>Importer une sauvegarde</h2><p class="note">Saisissez le code d'accès de l'appareil qui a produit la sauvegarde.</p><label for="imp-pin">Code d'accès<input type="password" id="imp-pin"></label><p class="alert b" id="imp-e" hidden></p><div class="row" style="margin:12px 0 0"><button class="btn p" id="imp-ok">Importer</button><button class="btn" id="imp-no">Annuler</button></div>`);
 b.querySelector("#imp-no").onclick=closeModal;
 b.querySelector("#imp-ok").onclick=async()=>{try{const {obj}=await unseal(blob,b.querySelector("#imp-pin").value);let n=0,c=0;
   obj.fiches.forEach(fi=>{const ex=DB.fiches.find(x=>x.id===fi.id);
    if(!ex){DB.fiches.push(fi);n++}else if(JSON.stringify(ex)!==JSON.stringify(fi)){fi.id=uid();fi.numero=(fi.numero||"")+" (copie importée)";DB.fiches.push(fi);c++}});
   closeModal();save();renderAll();toast(`${n} fiche(s) importée(s)${c?`, ${c} en copie (conflit)`:""}`)}catch(err){const e=b.querySelector("#imp-e");e.textContent="Code incorrect ou fichier endommagé.";e.hidden=false}}};
